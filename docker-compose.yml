version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://disaster_user:password@postgres:5432/disaster_intelligence
      - REDIS_URL=redis://redis:6379/0
      - COPERNICUS_STAC_URL=https://stac.dataspace.copernicus.eu/v1/
    depends_on:
      - postgres
      - redis
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: disaster_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  app_data:
  pg_data:
